<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eva</title>
<meta name="description" content="Eva, tu libreta y tu quincena en un solo lugar.">
<meta name="apple-mobile-web-app-title" content="Eva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBE3EC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<style>
html{background:#FBEFF4}
@media (prefers-color-scheme: dark){html{background:#12070D}}
/* Libreta: escenario con Eva, cifras del día, áreas, notas, quincena, respaldo y un campo para escribir. */
:root{
  --bg:#FBEFF4; --ink:#26101C; --ink-2:#4A2A3B; --muted:#8B6A7C; --hair:rgba(120,50,90,.12);
  --card:rgba(255,255,255,.62); --card-2:rgba(255,255,255,.86); --edge:rgba(255,255,255,.9); --edge-2:rgba(255,190,215,.55);
  --accent:#E8336F; --accent-2:#FF8A5B; --accent-ink:#FFFFFF; --mint:#13A57E; --violet:#8B6CF0;
  --b1:#FF9CC5; --b2:#FFC7A3; --b3:#BDEFE0; --b4:#E3D3FF; --grain:.06;
  --stage-1:#FFD9E8; --stage-2:#FFF4F8; --stage-floor:rgba(214,70,130,.22);
  --t-casa:#8A5CC9; --t-pago:#E0611E; --t-killian:#2479D1; --t-amelie:#E8336F; --t-kam:#13A57E; --t-nexia:#4553B8; --t-personal:#7C8F1E;
  --eye:#2E1424; --blush:#FF6F9F; --mouth:#7A2343; --heart:#FF4F8B;
  --sh-1:0 1px 1px rgba(120,30,70,.04),0 6px 14px -6px rgba(120,30,70,.14),0 24px 48px -24px rgba(160,40,95,.28);
  --sh-2:0 2px 2px rgba(120,30,70,.05),0 18px 40px -16px rgba(160,40,95,.35),0 50px 90px -40px rgba(160,40,95,.35);
  --display:"Bricolage Grotesque","SF Pro Display",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12070D; --ink:#FDEDF4; --ink-2:#EBCFDD; --muted:#B892A6; --hair:rgba(255,200,225,.1);
  --card:rgba(44,18,32,.6); --card-2:rgba(56,22,40,.88); --edge:rgba(255,200,225,.14); --edge-2:rgba(255,120,170,.3);
  --accent:#FF5E95; --accent-2:#FF9A68; --accent-ink:#2A0716; --mint:#4FDCB0; --violet:#A893FF;
  --b1:#7E2050; --b2:#6B3320; --b3:#0F4A3C; --b4:#3A2470; --grain:.09;
  --stage-1:#3A1229; --stage-2:#1C0A14; --stage-floor:rgba(255,90,150,.25);
  --t-casa:#C3A0F2; --t-pago:#FFA06E; --t-killian:#7DB8F5; --t-amelie:#FF8FBA; --t-kam:#4FDCB0; --t-nexia:#9EA8FF; --t-personal:#CFE06A;
  --sh-1:0 1px 1px rgba(0,0,0,.2),0 8px 20px -8px rgba(0,0,0,.5),0 24px 48px -24px rgba(0,0,0,.6);
  --sh-2:0 2px 2px rgba(0,0,0,.25),0 18px 40px -16px rgba(0,0,0,.6),0 50px 90px -40px rgba(120,20,70,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12070D; --ink:#FDEDF4; --ink-2:#EBCFDD; --muted:#B892A6; --hair:rgba(255,200,225,.1);
  --card:rgba(44,18,32,.6); --card-2:rgba(56,22,40,.88); --edge:rgba(255,200,225,.14); --edge-2:rgba(255,120,170,.3);
  --accent:#FF5E95; --accent-2:#FF9A68; --accent-ink:#2A0716; --mint:#4FDCB0; --violet:#A893FF;
  --b1:#7E2050; --b2:#6B3320; --b3:#0F4A3C; --b4:#3A2470; --grain:.09;
  --stage-1:#3A1229; --stage-2:#1C0A14; --stage-floor:rgba(255,90,150,.25);
  --t-casa:#C3A0F2; --t-pago:#FFA06E; --t-killian:#7DB8F5; --t-amelie:#FF8FBA; --t-kam:#4FDCB0; --t-nexia:#9EA8FF; --t-personal:#CFE06A;
  --sh-1:0 1px 1px rgba(0,0,0,.2),0 8px 20px -8px rgba(0,0,0,.5),0 24px 48px -24px rgba(0,0,0,.6);
  --sh-2:0 2px 2px rgba(0,0,0,.25),0 18px 40px -16px rgba(0,0,0,.6),0 50px 90px -40px rgba(120,20,70,.5);
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* aurora + grain */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora .pan{position:absolute;inset:-15%;transform:translate(calc(var(--px,0)*-22px),calc(var(--py,0)*-22px));transition:transform 1s var(--ease)}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:72vmax;height:72vmax;left:-28vmax;top:-34vmax;background:var(--b1);opacity:.85}
.b2{width:56vmax;height:56vmax;right:-24vmax;top:-10vmax;background:var(--b2);opacity:.7}
.b3{width:52vmax;height:52vmax;left:-14vmax;top:58vh;background:var(--b3);opacity:.6}
.b4{width:60vmax;height:60vmax;right:-28vmax;top:84vh;background:var(--b4);opacity:.6}
.grain{position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-block:12px 120px}

/* glass surface with gradient hairline + top highlight */
.glass{position:relative;background:var(--card);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--sh-1),inset 0 1px 0 var(--edge)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,var(--edge) 0%,transparent 40%,transparent 60%,var(--edge-2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--ink);font-variant-numeric:tabular-nums}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,8.6vw,40px);line-height:1;letter-spacing:-.035em}
h1 em{font-style:normal;background:linear-gradient(95deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .35s var(--spring)}
.iconbtn:active{transform:scale(.86)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.spin svg{animation:spin .9s linear infinite}

/* stage */
.stage{border-radius:34px;overflow:hidden;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;
  background:radial-gradient(120% 90% at 50% 0%,var(--stage-1) 0%,var(--stage-2) 70%)}
.stage .spot{position:absolute;inset:-20% 10% 30%;background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);opacity:.55;mix-blend-mode:soft-light;z-index:-1}
.stage .floor{position:absolute;left:50%;bottom:92px;width:56%;height:40px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--stage-floor),transparent);z-index:-1}
.motes{position:absolute;inset:0;z-index:-1;pointer-events:none}
.chipline{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64%}
.badge .live{display:block;flex:none;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 var(--mint);animation:live 2s infinite}
.badge.mood{color:var(--accent);flex:none}
.petbox{position:absolute;left:50%;top:40px;width:230px;height:230px;transform:translateX(-50%);z-index:1}
.petbox canvas,.petbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pet{position:absolute;inset:10%;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;z-index:3}
.petbox.gl .svgbody{display:none}
.halo{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(closest-side,var(--halo,rgba(255,140,190,.55)),transparent);filter:blur(8px);transition:background 1s;z-index:-1}
.say{margin:0 12px 12px;border-radius:24px;padding:14px 16px;font-size:15.5px;font-weight:600;line-height:1.38;min-height:52px;z-index:2;color:var(--ink)}
.say .who{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blinkc .8s steps(2) infinite}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:22px;padding:13px 13px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff}
.stat .ic svg{width:15px;height:15px}
.stat .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}

/* section heads */
section{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.025em}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

/* timeline */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dayhead .t{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.025em;margin:0}
.tl{display:flex;flex-direction:column}
.tl.slide{animation:slide .45s var(--ease)}
.allday{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 13px 9px 11px;border-radius:999px;font-weight:600;font-size:14px;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--accent));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--accent)) 20%,transparent)}
.item{display:grid;grid-template-columns:54px 20px 1fr;gap:0 10px;align-items:stretch}
.item .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted);padding-top:17px;text-align:right}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--hair)}
.item:first-child .rail::before,.now:first-child .rail::before{top:22px}
.item:last-child .rail::before,.now:last-child .rail::before{bottom:calc(100% - 22px)}
.rail .dot{position:relative;margin-top:19px}
.card{margin-block:5px;border-radius:20px;padding:13px 15px;min-width:0;display:flex;align-items:center;gap:12px;transition:transform .35s var(--spring)}
.card:active{transform:scale(.97)}
.card .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.card .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.ttl{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.item.past{opacity:.48}
.item.past .ttl{text-decoration:line-through;text-decoration-color:var(--hair)}
.now{display:grid;grid-template-columns:54px 20px 1fr;gap:0 10px;align-items:center;height:28px}
.now .t{font-weight:800;font-size:11px;color:var(--accent);text-align:right;letter-spacing:.12em;text-transform:uppercase}
.now .pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);position:relative;z-index:1;align-self:center}
.now .pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.now .ln{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.empty{border-radius:22px;padding:22px 18px;color:var(--muted);font-weight:600;text-align:center}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:-.02em;margin-bottom:2px}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .lab{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ringbox{display:flex;align-items:center;gap:18px}
.paycol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:color-mix(in srgb,var(--ink) 8%,transparent);stroke-width:11}
.ring .val{fill:none;stroke:url(#payg);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .mid b{display:block;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.payd{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.15}
.money{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:0}
.money dt{color:var(--muted);font-weight:600}
.money dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.money dd.plus{color:var(--mint)}
.fine{font-size:11.5px;color:var(--muted);font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.plist li{display:flex;gap:10px;align-items:center;min-width:0}
.plist .dd{flex:none;width:36px;height:40px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t-pago) 14%,transparent);color:var(--t-pago);line-height:1}
.plist .dd b{font-family:var(--display);font-weight:800;font-size:16px}
.plist .dd small{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.plist span{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.notice{border-radius:18px;padding:12px 14px;font-size:14px;font-weight:600;border-left:4px solid var(--t-pago)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.dockbtn{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:7px 7px 7px 8px;cursor:pointer;text-align:left;text-decoration:none;color:inherit;box-shadow:var(--sh-2),inset 0 1px 0 var(--edge);transition:transform .35s var(--spring)}
.dockbtn:active{transform:scale(.97)}
.mini{width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 32%,#FFD7E7,#F7A1C4 55%,#E57AA6);position:relative;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.mini::before,.mini::after{content:"";position:absolute;top:44%;width:6px;height:8px;border-radius:50%;background:var(--eye)}
.mini::before{left:30%}.mini::after{right:30%}
.dockbtn .ph{flex:1;font-weight:700;font-size:16px;letter-spacing:-.01em}
.dockbtn .go{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);flex:none}


/* libreta */
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-padding:16px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:0;cursor:pointer;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--card);color:var(--ink-2);box-shadow:var(--sh-1),inset 0 1px 0 var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:inline-flex;align-items:center;gap:7px;transition:transform .35s var(--spring),background .25s}
.quick button[style]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.quick button:active{transform:scale(.92)}
.quick button[aria-pressed="true"]{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.quick button[aria-pressed="true"]::before{background:currentColor}
.ghead{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 4px 2px}
.ghead:first-child{margin-top:0}
.note{align-items:flex-start;padding:12px 14px 12px 12px}
.note .check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;margin-top:1px;transition:transform .35s var(--spring),background .2s}
.note .check svg{width:16px;height:16px}
.note .check:active{transform:scale(.8)}
.note.done .check{background:var(--c);color:#fff}
.note.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.note.done{opacity:.62}
.note .tag{border:0;background:color-mix(in srgb,var(--c) 14%,transparent);padding:3px 8px;border-radius:999px;align-self:flex-start;cursor:pointer}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px 6px;animation:slide .3s var(--ease)}
.picker button{border:0;cursor:pointer;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 15%,var(--card-2));color:var(--c)}
.picker button[aria-current]{background:var(--c);color:#fff}
.picker .del{--c:var(--muted);margin-left:auto}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;cursor:pointer;padding:13px 16px;border-radius:999px;font-weight:800;font-size:15px;background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .35s var(--spring)}
.btn.main{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:none}
.btn:active{transform:scale(.95)}
.composer{cursor:text}
.composer:active{transform:none}
.composer input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-weight:600;font-size:16px;color:var(--ink);padding:10px 0}
.composer input::placeholder{color:var(--muted);font-weight:600}
.composer .go{border:0;cursor:pointer;transition:transform .35s var(--spring)}
.composer .go:active{transform:scale(.88)}
.composer:focus-within{box-shadow:var(--sh-2),inset 0 1px 0 var(--edge),0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}

/* Eva face (SVG) */
.shadow{fill:var(--stage-floor)}
.iris{fill:var(--eye)}
.glint{fill:#FFFFFF}
.lid,.brow{fill:none;stroke:var(--eye);stroke-width:4.5;stroke-linecap:round}
.blush{fill:var(--blush);opacity:.7}
#mouth{stroke:var(--eye);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
#mouth.open{fill:var(--mouth);stroke-width:3.5}
#sweat{fill:#9ED8F5;stroke:#5BB4E0;stroke-width:1.5}
.heart{fill:var(--heart)}
#eyes .eye,#body,#hop,.ear,#face,.heart{transform-box:fill-box;transform-origin:center}
.eye{transition:transform .08s,translate .5s var(--ease)}
.eye.shut{transform:scaleY(.08)}
#face{transition:transform .5s var(--ease)}

/* motion */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkc{50%{opacity:0}}
@keyframes ping{75%,100%{transform:scale(2.6);opacity:0}}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
@keyframes slide{from{transform:translateX(18px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .b1{animation:d1 22s ease-in-out infinite alternate}.b2{animation:d2 26s ease-in-out infinite alternate}
  .b3{animation:d3 30s ease-in-out infinite alternate}.b4{animation:d1 28s ease-in-out infinite alternate-reverse}
  @keyframes d1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
  @keyframes d2{to{transform:translate(-10vmax,14vmax) scale(.9)}}
  @keyframes d3{to{transform:translate(14vmax,-10vmax) scale(1.2)}}
  .rise{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i,0)*85ms)}
  @keyframes rise{from{transform:translateY(26px) scale(.97);opacity:.2;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
  .pop{animation:pop .6s var(--spring) both;animation-delay:calc(var(--i,0)*50ms)}
  @keyframes pop{from{transform:translateY(12px) scale(.94);opacity:.25}to{transform:none;opacity:1}}
  .halo{animation:halo 4s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.1);opacity:.8}}
  .petbox{animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
  .petbox[data-mood="joy"],.petbox[data-mood="love"]{animation:bounce .9s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0) scale(1,1)}45%{transform:translateX(-50%) translateY(-14px) scale(.97,1.03)}90%{transform:translateX(-50%) translateY(0) scale(1.04,.96)}}
  .petbox.giggle{animation:giggle .6s ease-in-out}
  @keyframes giggle{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-8deg) translateY(-8px)}75%{transform:translateX(-50%) rotate(8deg) translateY(-8px)}}
  .petbox:not(.gl) #body{animation:breathe 3.6s ease-in-out infinite}
  .petbox:not(.gl) .ear{animation:wiggle 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  @keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-10deg)}95%{transform:rotate(8deg)}}
  .heart{animation:float 1.6s ease-out forwards}
  @keyframes float{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-80px) scale(1.15);opacity:0}}
}
@media (max-width:370px){.stat .n{font-size:25px}.bento{grid-template-columns:1fr}.petbox{width:200px;height:200px}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><div class="pan"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div><div class="grain"></div></div>

<main class="wrap">
  <header class="top rise" style="--i:0">
    <div class="hello">
      <span class="eyebrow"><span id="wday">Hoy</span> · <b id="dnum">--.--</b></span>
      <h1><span id="greet">Hola,</span> <em>Adela</em></h1>
    </div>
  </header>

  <section class="stage glass rise" style="--i:1" aria-label="Eva">
    <div class="spot"></div><canvas class="motes" id="motes"></canvas><div class="floor"></div>
    <div class="chipline">
      <span class="badge glass" id="holiday"><i class="live"></i><span id="liveTxt">Libreta</span></span>
      <span class="badge glass mood" id="moodBadge">Tranquila</span>
    </div>
    <div class="petbox" id="petbox">
      <div class="halo"></div>
      <canvas id="fur3d" hidden></canvas>
      <svg id="eva" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <filter id="fur" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/></filter>
          <filter id="furSoft" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
          <radialGradient id="pink" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#FFD7E7"/><stop offset=".6" stop-color="#F7A1C4"/><stop offset="1" stop-color="#E57AA6"/></radialGradient>
        </defs>
        <g id="hop">
          <g id="body">
            <g class="svgbody">
              <ellipse class="shadow" cx="100" cy="190" rx="50" ry="7"/>
              <g id="earL" class="ear"><circle cx="44" cy="40" r="21" fill="#F7A1C4" filter="url(#fur)"/><circle cx="46" cy="42" r="10" fill="#FFC2D8"/></g>
              <g id="earR" class="ear"><circle cx="156" cy="40" r="21" fill="#F7A1C4" filter="url(#fur)"/><circle cx="154" cy="42" r="10" fill="#FFC2D8"/></g>
              <circle cx="100" cy="108" r="78" fill="#E57AA6" filter="url(#fur)"/>
              <circle cx="100" cy="104" r="72" fill="url(#pink)" filter="url(#furSoft)"/>
            </g>
            <g id="face">
              <path id="browL" class="brow" d=""/><path id="browR" class="brow" d=""/>
              <g id="eyes">
                <g class="eye" id="eyeL"><ellipse cx="76" cy="110" rx="10" ry="13" class="iris"/><g class="glint"><circle cx="79" cy="105" r="3.6"/><circle cx="73" cy="115" r="1.6"/></g></g>
                <g class="eye" id="eyeR"><ellipse cx="124" cy="110" rx="10" ry="13" class="iris"/><g class="glint"><circle cx="127" cy="105" r="3.6"/><circle cx="121" cy="115" r="1.6"/></g></g>
                <path id="happyL" class="lid" d="M66 113 Q76 101 86 113" hidden/>
                <path id="happyR" class="lid" d="M114 113 Q124 101 134 113" hidden/>
              </g>
              <ellipse cx="60" cy="131" rx="11" ry="6" class="blush"/><ellipse cx="140" cy="131" rx="11" ry="6" class="blush"/>
              <path id="mouth" d="M90 134 Q100 144 110 134"/>
            </g>
            <path id="sweat" d="M156 84 Q150 96 156 100 Q162 96 156 84Z" hidden/>
          </g>
          <g id="hearts"></g>
        </g>
      </svg>
      <button class="pet" id="pet" type="button" aria-label="Eva. Tócala."></button>
    </div>
    <p class="say glass" aria-live="polite"><span class="who">Eva</span><span id="say">Hola, Adela.</span></p>
  </section>

  <div class="stats">
    <div class="stat glass pop" style="--i:3"><span class="ic" style="background:linear-gradient(140deg,var(--accent),var(--accent-2))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><span class="n" id="sToday">–</span><span class="l">pendientes hoy</span></div>
    <div class="stat glass pop" style="--i:4"><span class="ic" style="background:linear-gradient(140deg,#F08A3C,var(--t-pago))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/></svg></span><span class="n" id="sPay">–</span><span class="l">pagos en 7 días</span></div>
    <div class="stat glass pop" style="--i:5"><span class="ic" style="background:linear-gradient(140deg,#2FC79A,var(--mint))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span class="n" id="sDays">–</span><span class="l" id="sDaysL">días a quincena</span></div>
  </div>

  <nav class="quick rise" id="quick" style="--i:3" aria-label="Áreas">
    <button type="button" data-v="hoy" aria-pressed="true">Hoy</button><button type="button" data-v="casa" style="--c:var(--t-casa)">Casa</button><button type="button" data-v="amelie" style="--c:var(--t-amelie)">Amelie</button><button type="button" data-v="killian" style="--c:var(--t-killian)">Killian</button><button type="button" data-v="pago" style="--c:var(--t-pago)">Pagos</button><button type="button" data-v="kam" style="--c:var(--t-kam)">KAM</button><button type="button" data-v="nexia" style="--c:var(--t-nexia)">Nexia</button>
  </nav>

  <section class="rise" style="--i:4" aria-labelledby="dayTitle">
    <div class="dayhead"><h2 class="t" id="dayTitle">Hoy</h2><span class="kicker" id="dayCount"></span></div>
    <div class="tl" id="tl"></div>
  </section>

  <section class="rise" style="--i:5" aria-label="Resumen">
    <div class="bento">
      <div class="tile glass wide">
        <span class="lab">Quincena</span>
        <div class="ringbox">
          <div class="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="payg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
              <circle class="trk" cx="60" cy="60" r="48"/><circle class="val" id="ringVal" cx="60" cy="60" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
            <div class="mid"><div><b id="ringN">–</b><small id="ringL">días</small></div></div>
          </div>
          <div class="paycol"><span class="payd" id="payWhen"></span><dl class="money" id="payMoney"></dl></div>
        </div>
        <span class="fine" id="payFine"></span>
      </div>
      <div class="tile glass wide">
        <span class="lab">Pagos cerca</span>
        <ul class="plist" id="plist"><li><span style="color:var(--muted)">Cargando…</span></li></ul>
      </div>
      <div class="tile glass wide">
        <span class="lab">Tu libreta vive en este teléfono</span>
        <span class="fine">Haz un respaldo de vez en cuando. Si cambias de teléfono o borras la app, lo restauras aquí.</span>
        <div class="btns"><button type="button" class="btn main" id="backup">Respaldo</button><button type="button" class="btn" id="restore">Restaurar</button></div>
        <input type="file" id="restoreFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>
<div class="dock">
  <form class="dockbtn glass composer" id="composer" autocomplete="off">
    <span class="mini" aria-hidden="true"></span>
    <input id="q" type="text" enterkeyhint="send" placeholder="Escribe como hablas…" aria-label="Escribe una nota o pregunta">
    <button class="go" type="submit" aria-label="Guardar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
</div>
<script src="app.js" defer></script>
</body></html>
